<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>100ピース ギフトパズル</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef9ff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  color:#333;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  margin:5px 0 10px;
  font-size:24px;
}

.description{
  text-align:center;
  font-size:14px;
  margin-bottom:10px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  font-weight:bold;
  background:#45b9e8;
  color:white;
  cursor:pointer;
}

button:hover{
  opacity:.85;
}

input[type="file"]{
  max-width:220px;
}

.counter{
  text-align:center;
  font-weight:bold;
  font-size:18px;
  margin:8px 0;
}

.canvas-wrap{
  width:100%;
  max-width:600px;
  margin:auto;
  background:#9eddf4;
  padding:8px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:6px;
  touch-action:manipulation;
  background:#9eddf4;
}

.section-title{
  margin:20px 0 8px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
}

.gifter-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.gifter-row{
  display:flex;
  align-items:center;
  gap:5px;
  background:white;
  border-radius:8px;
  padding:5px;
  border:1px solid #d8eaf2;
}

.gifter-row.opened{
  background:#e5f8ff;
  border-color:#42bce8;
}

.gifter-number{
  width:35px;
  text-align:center;
  font-weight:bold;
  flex:none;
}

.gifter-input{
  width:100%;
  min-width:0;
  border:1px solid #ccc;
  border-radius:6px;
  padding:7px;
  font-size:14px;
}

.gifter-status{
  width:28px;
  text-align:center;
  flex:none;
}

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(90%,420px);
  background:white;
  border-radius:20px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
  animation:pop .2s ease;
}

@keyframes pop{
  from{
    transform:scale(.8);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.thanks{
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
  color:#159acb;
}

.piece-number{
  font-size:15px;
  color:#777;
}

.complete{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  z-index:200;
  padding:20px;
}

.complete.show{
  display:flex;
}

.complete-box{
  background:white;
  padding:30px;
  border-radius:20px;
  text-align:center;
  max-width:420px;
}

.complete-box h2{
  font-size:30px;
  margin:0 0 15px;
}

@media(max-width:600px){

  h1{
    font-size:20px;
  }

  .gifter-grid{
    grid-template-columns:1fr;
  }

  .thanks{
    font-size:24px;
  }

}
</style>
</head>

<body>

<div class="container">

<h1>🎁 100ピース ギフトパズル</h1>

<div class="description">
ウルトラスタンプ1個で1ピースOPEN！<br>
ピースをタップしてギフターさんに感謝を伝えよう！
</div>

<div class="controls">

<label>
<input type="file" id="imageInput" accept="image/*">
</label>

<button onclick="openRandomPiece()">
🎲 ランダムOPEN
</button>

<button onclick="resetPuzzle()">
🔄 リセット
</button>

</div>

<div class="counter">
完成：<span id="count">0</span> / 100
</div>

<div class="canvas-wrap">
<canvas id="puzzleCanvas"></canvas>
</div>

<div class="section-title">
💝 ギフターさん一覧
</div>

<div class="gifter-grid" id="gifterGrid"></div>

</div>


<!-- ありがとう表示 -->

<div class="modal" id="thanksModal">

  <div class="modal-box">

    <div class="piece-number">
      ピース No.<span id="popupPiece"></span>
    </div>

    <div class="thanks">
      <span id="popupName"></span>さんありがとう！💖
    </div>

    <button onclick="closeModal()">
      閉じる
    </button>

  </div>

</div>


<!-- 完成表示 -->

<div class="complete" id="completeModal">

  <div class="complete-box">

    <h2>🎉 完成！ 🎉</h2>

    <p>
      100ピースのパズルが完成しました！
    </p>

    <p>
      たくさんの応援<br>
      ありがとうございました💖
    </p>

    <button onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>

/* =====================================
   基本設定
===================================== */

const COLS = 10;
const ROWS = 10;
const TOTAL = 100;

const canvas =
  document.getElementById("puzzleCanvas");

const ctx =
  canvas.getContext("2d");

const W = 900;
const H = 1200;

canvas.width = W;
canvas.height = H;


/* =====================================
   パズル状態
===================================== */

let opened =
  new Array(TOTAL).fill(false);

let gifterNames =
  new Array(TOTAL).fill("");

let verticalEdges = [];
let horizontalEdges = [];


/* =====================================
   画像
===================================== */

let image = new Image();

image.crossOrigin = "anonymous";

image.src =
"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80";


/* =====================================
   ジグソー境界生成
===================================== */

function generateEdges(){

  verticalEdges = [];

  for(let r=0;r<ROWS;r++){

    const row = [];

    for(let c=0;c<=COLS;c++){

      if(c===0 || c===COLS){

        row.push(0);

      }else{

        row.push(
          Math.random() > 0.5 ? 1 : -1
        );

      }

    }

    verticalEdges.push(row);
  }


  horizontalEdges = [];

  for(let r=0;r<=ROWS;r++){

    const row = [];

    for(let c=0;c<COLS;c++){

      if(r===0 || r===ROWS){

        row.push(0);

      }else{

        row.push(
          Math.random() > 0.5 ? 1 : -1
        );

      }

    }

    horizontalEdges.push(row);
  }

}


/* =====================================
   ピース形状
===================================== */

function createPiecePath(row,col){

  const cellW = W / COLS;
  const cellH = H / ROWS;

  const x = col * cellW;
  const y = row * cellH;

  const tab =
    Math.min(cellW,cellH) * 0.23;

  const path = new Path2D();


  /* 上 */

  path.moveTo(x,y);

  const top =
    horizontalEdges[row][col];

  if(top===0){

    path.lineTo(
      x+cellW,
      y
    );

  }else{

    path.lineTo(
      x+cellW*0.35,
      y
    );

    path.bezierCurveTo(
      x+cellW*0.42,
      y-top*tab,
      x+cellW*0.58,
      y-top*tab,
      x+cellW*0.65,
      y
    );

    path.lineTo(
      x+cellW,
      y
    );

  }


  /* 右 */

  const right =
    verticalEdges[row][col+1];

  if(right===0){

    path.lineTo(
      x+cellW,
      y+cellH
    );

  }else{

    path.lineTo(
      x+cellW,
      y+cellH*0.35
    );

    path.bezierCurveTo(
      x+cellW+right*tab,
      y+cellH*0.42,
      x+cellW+right*tab,
      y+cellH*0.58,
      x+cellW,
      y+cellH*0.65
    );

    path.lineTo(
      x+cellW,
      y+cellH
    );

  }


  /* 下 */

  const bottom =
    horizontalEdges[row+1][col];

  if(bottom===0){

    path.lineTo(
      x,
      y+cellH
    );

  }else{

    path.lineTo(
      x+cellW*0.65,
      y+cellH
    );

    path.bezierCurveTo(
      x+cellW*0.58,
      y+cellH+bottom*tab,
      x+cellW*0.42,
      y+cellH+bottom*tab,
      x+cellW*0.35,
      y+cellH
    );

    path.lineTo(
      x,
      y+cellH
    );

  }


  /* 左 */

  const left =
    verticalEdges[row][col];

  if(left===0){

    path.lineTo(
      x,
      y
    );

  }else{

    path.lineTo(
      x,
      y+cellH*0.65
    );

    path.bezierCurveTo(
      x-left*tab,
      y+cellH*0.58,
      x-left*tab,
      y+cellH*0.42,
      x,
      y+cellH*0.35
    );

    path.lineTo(
      x,
      y
    );

  }

  path.closePath();

  return path;

}


/* =====================================
   画像描画
===================================== */

function drawImage(){

  if(
    !image.complete ||
    !image.naturalWidth
  ){
    return;
  }

  const scale =
    Math.max(
      W/image.naturalWidth,
      H/image.naturalHeight
    );

  const iw =
    image.naturalWidth * scale;

  const ih =
    image.naturalHeight * scale;

  const ix =
    (W-iw)/2;

  const iy =
    (H-ih)/2;

  ctx.drawImage(
    image,
    ix,
    iy,
    iw,
    ih
  );

}


/* =====================================
   パズル描画
===================================== */

function drawPuzzle(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    未開封部分の裏面
  */

  ctx.fillStyle =
    "#9eddf4";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    開封済みピース
  */

  for(let i=0;i<TOTAL;i++){

    if(!opened[i]) continue;

    const row =
      Math.floor(i/COLS);

    const col =
      i%COLS;

    const path =
      createPiecePath(row,col);

    ctx.save();

    ctx.clip(path);

    drawImage();

    ctx.restore();

  }


  /*
    ★重要
    画像の繋ぎ目に裏面が残らないよう
    ピース境界を太めに描画
  */

  ctx.lineWidth = 4;

  ctx.strokeStyle =
    "rgba(80,80,80,0.75)";

  ctx.lineJoin = "round";

  ctx.lineCap = "round";


  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      const index =
        r*COLS+c;

      const path =
        createPiecePath(r,c);

      /*
        開いたピースは画像側の境界を強調。
        未開封との境界も裏面が見えないよう処理。
      */

      ctx.stroke(path);

    }

  }


  /*
    未開封ピースの番号
  */

  const cellW =
    W/COLS;

  const cellH =
    H/ROWS;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for(let i=0;i<TOTAL;i++){

    if(opened[i]) continue;

    const row =
      Math.floor(i/COLS);

    const col =
      i%COLS;

    const x =
      col*cellW;

    const y =
      row*cellH;


    /*
      番号の丸
    */

    ctx.fillStyle =
      "rgba(255,255,255,.9)";

    ctx.beginPath();

    ctx.arc(
      x+cellW/2,
      y+cellH/2,
      Math.min(cellW,cellH)*.17,
      0,
      Math.PI*2
    );

    ctx.fill();


    /*
      番号
    */

    ctx.fillStyle =
      "#168cb8";

    ctx.font =
      "bold "+
      Math.floor(
        Math.min(cellW,cellH)*.18
      )+
      "px Arial";

    ctx.fillText(
      i+1,
      x+cellW/2,
      y+cellH/2
    );

  }

}


/* =====================================
   ギフター一覧
===================================== */

function createGifterList(){

  const grid =
    document.getElementById(
      "gifterGrid"
    );

  grid.innerHTML = "";


  for(let i=0;i<TOTAL;i++){

    const row =
      document.createElement("div");

    row.className =
      "gifter-row";

    row.id =
      "gifterRow-"+i;


    const number =
      document.createElement("div");

    number.className =
      "gifter-number";

    number.textContent =
      i+1;


    const input =
      document.createElement("input");

    input.className =
      "gifter-input";

    input.placeholder =
      "ギフターさんの名前";

    input.value =
      gifterNames[i];


    input.addEventListener(
      "input",
      function(){

        gifterNames[i] =
          input.value;

      }
    );


    const status =
      document.createElement("div");

    status.className =
      "gifter-status";

    status.textContent =
      opened[i] ? "✅" : "";


    row.appendChild(number);
    row.appendChild(input);
    row.appendChild(status);

    grid.appendChild(row);

  }

}


/* =====================================
   「さん」の重複防止
===================================== */

function cleanName(name){

  name = name.trim();

  /*
    「さん」を付けて入力されていても
    1回だけにする
  */

  if(name.endsWith("さん")){

    name =
      name.substring(
        0,
        name.length-2
      );

  }

  return name;

}


/* =====================================
   ピースOPEN
===================================== */

function openPiece(index){

  if(
    index<0 ||
    index>=TOTAL
  ){
    return;
  }


  const rawName =
    gifterNames[index].trim();

  const clean =
    cleanName(rawName);


  /*
    名前が空欄の場合
  */

  const displayName =
    clean || "ギフターさん";


  if(!opened[index]){

    opened[index] = true;

    updateGifterStatus(index);

    updateCounter();

    drawPuzzle();

  }


  /*
    ポップアップ
  */

  document.getElementById(
    "popupPiece"
  ).textContent =
    index+1;

  document.getElementById(
    "popupName"
  ).textContent =
    displayName;


  document.getElementById(
    "thanksModal"
  ).classList.add("show");


  checkComplete();

}


/* =====================================
   パズルタップ
===================================== */

canvas.addEventListener(
  "click",
  function(e){

    const rect =
      canvas.getBoundingClientRect();

    const scaleX =
      W/rect.width;

    const scaleY =
      H/rect.height;

    const x =
      (e.clientX-rect.left)*scaleX;

    const y =
      (e.clientY-rect.top)*scaleY;


    const col =
      Math.floor(
        x/(W/COLS)
      );

    const row =
      Math.floor(
        y/(H/ROWS)
      );


    if(
      col<0 ||
      col>=COLS ||
      row<0 ||
      row>=ROWS
    ){
      return;
    }


    const index =
      row*COLS+col;

    openPiece(index);

  }
);


/* =====================================
   ランダムOPEN
===================================== */

function openRandomPiece(){

  const remaining = [];

  for(let i=0;i<TOTAL;i++){

    if(!opened[i]){
      remaining.push(i);
    }

  }

  if(remaining.length===0){
    return;
  }


  const index =
    remaining[
      Math.floor(
        Math.random()*remaining.length
      )
    ];

  openPiece(index);

}


/* =====================================
   ギフター状態
===================================== */

function updateGifterStatus(index){

  const row =
    document.getElementById(
      "gifterRow-"+index
    );

  if(!row) return;


  row.classList.add("opened");


  const status =
    row.querySelector(
      ".gifter-status"
    );

  status.textContent =
    "✅";

}


/* =====================================
   カウンター
===================================== */

function updateCounter(){

  const count =
    opened.filter(Boolean).length;

  document.getElementById(
    "count"
  ).textContent =
    count;

}


/* =====================================
   完成判定
===================================== */

function checkComplete(){

  if(opened.every(Boolean)){

    setTimeout(
      function(){

        document
          .getElementById(
            "completeModal"
          )
          .classList.add("show");

      },
      500
    );

  }

}


/* =====================================
   モーダル
===================================== */

function closeModal(){

  document
    .getElementById(
      "thanksModal"
    )
    .classList.remove("show");

}


function closeComplete(){

  document
    .getElementById(
      "completeModal"
    )
    .classList.remove("show");

}


/* =====================================
   リセット
===================================== */

function resetPuzzle(){

  if(
    !confirm(
      "パズルを最初からやり直しますか？"
    )
  ){
    return;
  }


  opened =
    new Array(TOTAL).fill(false);

  generateEdges();

  createGifterList();

  updateCounter();

  drawPuzzle();

}


/* =====================================
   画像選択
===================================== */

document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    function(e){

      const file =
        e.target.files[0];

      if(!file){
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(event){

          image =
            new Image();

          image.onload =
            function(){

              drawPuzzle();

            };

          image.src =
            event.target.result;

        };


      reader.readAsDataURL(file);

    }
  );


/* =====================================
   初期化
===================================== */

image.onload =
  function(){

    generateEdges();

    createGifterList();

    drawPuzzle();

  };

</script>

</body>
</html>
