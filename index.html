<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>🎁 100ピース ギフトパズル</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:#eef9ff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  color:#333;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:10px;
}

h1{
  text-align:center;
  margin:5px 0 8px;
  font-size:24px;
  font-weight:800;
}

.description{
  text-align:center;
  font-size:14px;
  line-height:1.6;
  margin-bottom:10px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:9px 14px;
  background:#45b9e8;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.12);
}

button:hover{
  opacity:.85;
}

button:active{
  transform:scale(.97);
}

input[type="file"]{
  max-width:230px;
  font-size:12px;
}

.counter{
  text-align:center;
  margin:7px 0 10px;
  font-size:18px;
  font-weight:bold;
}

#count{
  color:#159acb;
  font-size:24px;
}

.canvas-wrap{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:6px;
  background:#9eddf4;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#9eddf4;
  border-radius:7px;
  touch-action:manipulation;
  cursor:pointer;
}

.section-title{
  margin:20px 0 8px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.gifter-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:5px;
}

.gifter-row{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  padding:5px;
  background:white;
  border:1px solid #d8eaf2;
  border-radius:8px;
  transition:.2s;
}

.gifter-row.opened{
  background:#e5f8ff;
  border-color:#42bce8;
}

.gifter-number{
  width:35px;
  flex:none;
  text-align:center;
  font-weight:bold;
  color:#168cb8;
}

.gifter-input{
  width:100%;
  min-width:0;
  padding:7px;
  border:1px solid #ccc;
  border-radius:6px;
  outline:none;
  font-size:14px;
}

.gifter-input:focus{
  border-color:#42bce8;
}

.gifter-status{
  width:28px;
  flex:none;
  text-align:center;
}

/* =====================================
   ありがとうモーダル
===================================== */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(90%,420px);
  padding:25px 20px;
  background:white;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
  animation:pop .2s ease;
}

@keyframes pop{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

.piece-number{
  font-size:15px;
  color:#777;
}

.thanks{
  margin:15px 0;
  color:#159acb;
  font-size:28px;
  font-weight:bold;
  line-height:1.4;
  word-break:break-word;
}

/* =====================================
   完成
===================================== */

.complete{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
  z-index:200;
}

.complete.show{
  display:flex;
}

.complete-box{
  width:min(90%,420px);
  padding:30px;
  background:white;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.complete-box h2{
  margin:0 0 15px;
  font-size:30px;
}

.complete-box p{
  font-size:16px;
  line-height:1.8;
}

/* =====================================
   スマホ
===================================== */

@media(max-width:600px){

  .container{
    padding:7px;
  }

  h1{
    font-size:20px;
  }

  .description{
    font-size:13px;
  }

  .gifter-grid{
    grid-template-columns:1fr;
  }

  .thanks{
    font-size:24px;
  }

}

</style>

</head>


<body>

<div class="container">


<h1>
🎁 100ピース ギフトパズル
</h1>


<div class="description">

ウルトラスタンプ1個で1ピースOPEN！<br>

ピースをタップして
ギフターさんに感謝を伝えよう💖

</div>


<div class="controls">

<label>

<input
  type="file"
  id="imageInput"
  accept="image/*"
>

</label>


<button onclick="openRandomPiece()">
🎲 ランダムOPEN
</button>


<button onclick="resetPuzzle()">
🔄 リセット
</button>

</div>


<div class="counter">

完成：
<span id="count">0</span>
 / 100

</div>


<div class="canvas-wrap">

<canvas id="puzzleCanvas"></canvas>

</div>


<div class="section-title">
💝 ギフターさん一覧
</div>


<div
  class="gifter-grid"
  id="gifterGrid"
></div>

</div>


<!-- =====================================
     ありがとう
===================================== -->

<div
  class="modal"
  id="thanksModal"
>

<div class="modal-box">

<div class="piece-number">

ピース No.
<span id="popupPiece"></span>

</div>


<div class="thanks">

<span id="popupName"></span>
さんありがとう！💖

</div>


<button onclick="closeModal()">
閉じる
</button>

</div>

</div>


<!-- =====================================
     完成
===================================== -->

<div
  class="complete"
  id="completeModal"
>

<div class="complete-box">

<h2>
🎉 完成！ 🎉
</h2>

<p>
100ピースのパズルが完成しました！
</p>

<p>
たくさんの応援<br>
ありがとうございました💖
</p>

<button onclick="closeComplete()">
閉じる
</button>

</div>

</div>


<script>

/* =====================================
   基本設定
===================================== */

const COLS = 10;
const ROWS = 10;
const TOTAL = 100;

const W = 900;
const H = 900;

const canvas =
  document.getElementById("puzzleCanvas");

const ctx =
  canvas.getContext("2d");

canvas.width = W;
canvas.height = H;


/* =====================================
   状態
===================================== */

let opened =
  new Array(TOTAL).fill(false);

let gifterNames =
  new Array(TOTAL).fill("");

let verticalEdges = [];

let horizontalEdges = [];


/* =====================================
   画像
===================================== */

let image = new Image();

image.crossOrigin = "anonymous";


/*
   初期画像
*/

image.src =
"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80";


/* =====================================
   境界生成
===================================== */

function generateEdges(){

  /*
     縦の境界

     +1 / -1 は凸凹の向き
  */

  verticalEdges = [];

  for(
    let r = 0;
    r < ROWS;
    r++
  ){

    const row = [];

    for(
      let c = 0;
      c <= COLS;
      c++
    ){

      if(
        c === 0 ||
        c === COLS
      ){

        row.push(0);

      }else{

        row.push(
          Math.random() < .5
            ? 1
            : -1
        );

      }

    }

    verticalEdges.push(row);

  }


  /*
     横の境界
  */

  horizontalEdges = [];

  for(
    let r = 0;
    r <= ROWS;
    r++
  ){

    const row = [];

    for(
      let c = 0;
      c < COLS;
      c++
    ){

      if(
        r === 0 ||
        r === ROWS
      ){

        row.push(0);

      }else{

        row.push(
          Math.random() < .5
            ? 1
            : -1
        );

      }

    }

    horizontalEdges.push(row);

  }

}


/* =====================================
   ジグソーピース形状
===================================== */

function createPiecePath(row,col){

  const cellW =
    W / COLS;

  const cellH =
    H / ROWS;

  const x =
    col * cellW;

  const y =
    row * cellH;


  /*
     凸部分

     画像に合わせて
     少し丸みを大きめに
  */

  const tab =
    Math.min(
      cellW,
      cellH
    ) * 0.25;


  const path =
    new Path2D();


  /* =================================
     上
  ================================= */

  path.moveTo(
    x,
    y
  );


  const topEdge =
    horizontalEdges[row][col];


  if(topEdge === 0){

    path.lineTo(
      x + cellW,
      y
    );

  }else{

    path.lineTo(
      x + cellW * .35,
      y
    );


    /*
       上側のピース

       下辺は
       topEdge方向に出る
    */

    path.bezierCurveTo(

      x + cellW * .40,

      y + topEdge * tab,

      x + cellW * .60,

      y + topEdge * tab,

      x + cellW * .65,

      y

    );


    path.lineTo(
      x + cellW,
      y
    );

  }


  /* =================================
     右
  ================================= */

  const rightEdge =
    verticalEdges[row][col + 1];


  if(rightEdge === 0){

    path.lineTo(
      x + cellW,
      y + cellH
    );

  }else{

    path.lineTo(
      x + cellW,
      y + cellH * .35
    );


    path.bezierCurveTo(

      x + cellW + rightEdge * tab,

      y + cellH * .40,

      x + cellW + rightEdge * tab,

      y + cellH * .60,

      x + cellW,

      y + cellH * .65

    );


    path.lineTo(
      x + cellW,
      y + cellH
    );

  }


  /* =================================
     下
  ================================= */

  const bottomEdge =
    horizontalEdges[row + 1][col];


  if(bottomEdge === 0){

    path.lineTo(
      x,
      y + cellH
    );

  }else{

    path.lineTo(
      x + cellW * .65,
      y + cellH
    );


    /*
       下辺は
       上側とは逆向き
    */

    path.bezierCurveTo(

      x + cellW * .60,

      y - bottomEdge * tab + cellH,

      x + cellW * .40,

      y - bottomEdge * tab + cellH,

      x + cellW * .35,

      y + cellH

    );


    path.lineTo(
      x,
      y + cellH
    );

  }


  /* =================================
     左
  ================================= */

  const leftEdge =
    verticalEdges[row][col];


  if(leftEdge === 0){

    path.lineTo(
      x,
      y
    );

  }else{

    path.lineTo(
      x,
      y + cellH * .65
    );


    /*
       左辺は
       右側ピースとは逆向き
    */

    path.bezierCurveTo(

      x - leftEdge * tab,

      y + cellH * .60,

      x - leftEdge * tab,

      y + cellH * .40,

      x,

      y + cellH * .35

    );


    path.lineTo(
      x,
      y
    );

  }


  path.closePath();

  return path;

}


/* =====================================
   画像描画
===================================== */

function drawImage(){

  if(
    !image.complete ||
    !image.naturalWidth
  ){

    return;

  }


  const scale =
    Math.max(
      W / image.naturalWidth,
      H / image.naturalHeight
    );


  const iw =
    image.naturalWidth * scale;

  const ih =
    image.naturalHeight * scale;


  const ix =
    (W - iw) / 2;

  const iy =
    (H - ih) / 2;


  ctx.drawImage(
    image,
    ix,
    iy,
    iw,
    ih
  );

}


/* =====================================
   パズル描画
===================================== */

function drawPuzzle(){

  /*
     ★★★★★★★★★★★★★★★★★

     ここが今回の重要ポイント

     最初に画像全体を描かない。

     OPENしたピースだけに
     画像を描く。

     これで未OPEN部分から
     画像が漏れることがない。

     ★★★★★★★★★★★★★★★★★
  */


  /* =================================
     ① 全体を水色
  ================================= */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.fillStyle =
    "#9eddf4";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* =================================
     ② OPENしたピースだけ画像
  ================================= */

  for(
    let i = 0;
    i < TOTAL;
    i++
  ){

    if(!opened[i]){
      continue;
    }


    const row =
      Math.floor(
        i / COLS
      );


    const col =
      i % COLS;


    const path =
      createPiecePath(
        row,
        col
      );


    ctx.save();


    /*
       ピース形状の内側だけ
       画像を表示
    */

    ctx.clip(path);


    drawImage();


    ctx.restore();

  }


  /* =================================
     ③ 境界線
  ================================= */

  ctx.lineWidth = 2.5;

  ctx.strokeStyle =
    "rgba(65,65,65,.80)";

  ctx.lineJoin =
    "round";

  ctx.lineCap =
    "round";


  for(
    let r = 0;
    r < ROWS;
    r++
  ){

    for(
      let c = 0;
      c < COLS;
      c++
    ){

      const path =
        createPiecePath(
          r,
          c
        );


      ctx.stroke(path);

    }

  }


  /* =================================
     ④ 未OPEN番号
  ================================= */

  const cellW =
    W / COLS;

  const cellH =
    H / ROWS;


  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  for(
    let i = 0;
    i < TOTAL;
    i++
  ){

    if(opened[i]){
      continue;
    }


    const row =
      Math.floor(
        i / COLS
      );


    const col =
      i % COLS;


    const x =
      col * cellW;

    const y =
      row * cellH;


    /*
       番号の白丸
    */

    ctx.fillStyle =
      "rgba(255,255,255,.92)";


    ctx.beginPath();


    ctx.arc(

      x + cellW / 2,

      y + cellH / 2,

      Math.min(
        cellW,
        cellH
      ) * .17,

      0,
      Math.PI * 2

    );


    ctx.fill();


    /*
       番号
    */

    ctx.fillStyle =
      "#168cb8";


    ctx.font =
      "bold " +
      Math.floor(
        Math.min(
          cellW,
          cellH
        ) * .18
      ) +
      "px Arial";


    ctx.fillText(

      i + 1,

      x + cellW / 2,

      y + cellH / 2

    );

  }

}


/* =====================================
   ギフター一覧
===================================== */

function createGifterList(){

  const grid =
    document.getElementById(
      "gifterGrid"
    );


  grid.innerHTML = "";


  for(
    let i = 0;
    i < TOTAL;
    i++
  ){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "gifter-row";


    row.id =
      "gifterRow-" + i;


    if(opened[i]){

      row.classList.add(
        "opened"
      );

    }


    const number =
      document.createElement(
        "div"
      );


    number.className =
      "gifter-number";


    number.textContent =
      i + 1;


    const input =
      document.createElement(
        "input"
      );


    input.className =
      "gifter-input";


    input.placeholder =
      "ギフターさんの名前";


    input.value =
      gifterNames[i];


    input.addEventListener(
      "input",
      function(){

        gifterNames[i] =
          input.value;

      }
    );


    const status =
      document.createElement(
        "div"
      );


    status.className =
      "gifter-status";


    status.textContent =
      opened[i]
        ? "✅"
        : "";


    row.appendChild(
      number
    );

    row.appendChild(
      input
    );

    row.appendChild(
      status
    );


    grid.appendChild(
      row
    );

  }

}


/* =====================================
   名前処理
===================================== */

function cleanName(name){

  name =
    name.trim();


  if(
    name.endsWith("さん")
  ){

    name =
      name.substring(
        0,
        name.length - 2
      );

  }


  return name;

}


/* =====================================
   ピースOPEN
===================================== */

function openPiece(index){

  if(
    index < 0 ||
    index >= TOTAL
  ){

    return;

  }


  const rawName =
    gifterNames[index].trim();


  const clean =
    cleanName(rawName);


  const displayName =
    clean ||
    "ギフターさん";


  if(!opened[index]){

    opened[index] = true;


    updateGifterStatus(
      index
    );


    updateCounter();


    /*
       OPENしたピースだけ
       画像を追加表示
    */

    drawPuzzle();

  }


  /*
     ありがとう表示
  */

  document.getElementById(
    "popupPiece"
  ).textContent =
    index + 1;


  document.getElementById(
    "popupName"
  ).textContent =
    displayName;


  document.getElementById(
    "thanksModal"
  ).classList.add(
    "show"
  );


  checkComplete();

}


/* =====================================
   キャンバスタップ
===================================== */

canvas.addEventListener(
  "click",
  function(e){

    const rect =
      canvas.getBoundingClientRect();


    const scaleX =
      W / rect.width;


    const scaleY =
      H / rect.height;


    const x =
      (e.clientX - rect.left)
      * scaleX;


    const y =
      (e.clientY - rect.top)
      * scaleY;


    const col =
      Math.floor(
        x / (W / COLS)
      );


    const row =
      Math.floor(
        y / (H / ROWS)
      );


    if(
      col < 0 ||
      col >= COLS ||
      row < 0 ||
      row >= ROWS
    ){

      return;

    }


    const index =
      row * COLS + col;


    openPiece(index);

  }
);


/* =====================================
   ランダムOPEN
===================================== */

function openRandomPiece(){

  const remaining = [];


  for(
    let i = 0;
    i < TOTAL;
    i++
  ){

    if(!opened[i]){

      remaining.push(i);

    }

  }


  if(
    remaining.length === 0
  ){

    return;

  }


  const index =
    remaining[
      Math.floor(
        Math.random()
        * remaining.length
      )
    ];


  openPiece(index);

}


/* =====================================
   ギフター状態
===================================== */

function updateGifterStatus(index){

  const row =
    document.getElementById(
      "gifterRow-" + index
    );


  if(!row){
    return;
  }


  row.classList.add(
    "opened"
  );


  const status =
    row.querySelector(
      ".gifter-status"
    );


  if(status){

    status.textContent =
      "✅";

  }

}


/* =====================================
   カウンター
===================================== */

function updateCounter(){

  const count =
    opened.filter(
      Boolean
    ).length;


  document.getElementById(
    "count"
  ).textContent =
    count;

}


/* =====================================
   完成判定
===================================== */

function checkComplete(){

  if(
    opened.every(
      Boolean
    )
  ){

    setTimeout(
      function(){

        document
          .getElementById(
            "completeModal"
          )
          .classList.add(
            "show"
          );

      },
      500
    );

  }

}


/* =====================================
   モーダル
===================================== */

function closeModal(){

  document
    .getElementById(
      "thanksModal"
    )
    .classList.remove(
      "show"
    );

}


function closeComplete(){

  document
    .getElementById(
      "completeModal"
    )
    .classList.remove(
      "show"
    );

}


/* =====================================
   リセット
===================================== */

function resetPuzzle(){

  const ok =
    confirm(
      "パズルを最初からやり直しますか？"
    );


  if(!ok){

    return;

  }


  /*
     OPEN状態だけリセット

     名前・画像は残す
  */

  opened =
    new Array(
      TOTAL
    ).fill(false);


  /*
     パズルの形も
     新しくする
  */

  generateEdges();


  createGifterList();


  updateCounter();


  drawPuzzle();

}


/* =====================================
   画像選択
===================================== */

document
  .getElementById(
    "imageInput"
  )
  .addEventListener(
    "change",
    function(e){

      const file =
        e.target.files[0];


      if(!file){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event){

          image =
            new Image();


          image.onload =
            function(){

              /*
                 ★画像を変更しても
                 OPEN済み部分だけ表示

                 未OPEN部分には
                 絶対に画像を描かない
              */

              drawPuzzle();

            };


          image.src =
            event.target.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );


/* =====================================
   初期化
===================================== */

image.onload =
  function(){

    generateEdges();

    createGifterList();

    updateCounter();

    drawPuzzle();

  };

</script>

</body>

</html>
