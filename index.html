<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>🎁 100ピース ギフトパズル</title>

<style>

/* =====================================
   基本
===================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:#eef9ff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
  color:#333;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:10px;
}


/* =====================================
   タイトル
===================================== */

h1{
  text-align:center;
  margin:5px 0 8px;
  font-size:24px;
  font-weight:800;
}

.description{
  text-align:center;
  font-size:14px;
  line-height:1.6;
  margin-bottom:10px;
}


/* =====================================
   ボタン
===================================== */

.controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:9px 14px;
  background:#45b9e8;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.12);
}

button:hover{
  opacity:.85;
}

button:active{
  transform:scale(.97);
}

input[type="file"]{
  max-width:230px;
  font-size:12px;
}


/* =====================================
   カウンター
===================================== */

.counter{
  text-align:center;
  margin:7px 0 10px;
  font-size:18px;
  font-weight:bold;
}

#count{
  color:#159acb;
  font-size:24px;
}


/* =====================================
   パズル
===================================== */

.canvas-wrap{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:6px;
  background:#9eddf4;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#9eddf4;
  border-radius:5px;
  touch-action:manipulation;
  cursor:pointer;
}


/* =====================================
   ギフター一覧
===================================== */

.section-title{
  margin:20px 0 8px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.gifter-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:5px;
}

.gifter-row{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  padding:5px;
  background:white;
  border:1px solid #d8eaf2;
  border-radius:8px;
  transition:.2s;
}

.gifter-row.opened{
  background:#e5f8ff;
  border-color:#42bce8;
}

.gifter-number{
  width:35px;
  flex:none;
  text-align:center;
  font-weight:bold;
  color:#168cb8;
}

.gifter-input{
  width:100%;
  min-width:0;
  padding:7px;
  border:1px solid #ccc;
  border-radius:6px;
  outline:none;
  font-size:14px;
}

.gifter-input:focus{
  border-color:#42bce8;
}

.gifter-status{
  width:28px;
  flex:none;
  text-align:center;
}


/* =====================================
   画像読み込み中
===================================== */

.loading{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  background:rgba(255,255,255,.88);
  z-index:500;
}

.loading.show{
  display:flex;
}

.loading-spinner{
  width:50px;
  height:50px;
  border:5px solid #d8f1fa;
  border-top-color:#159acb;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.loading-text{
  color:#159acb;
  font-size:18px;
  font-weight:bold;
  text-align:center;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================
   ありがとうモーダル
===================================== */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(90%,420px);
  padding:25px 20px;
  background:white;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
  animation:pop .2s ease;
}

@keyframes pop{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

.piece-number{
  font-size:15px;
  color:#777;
}

.thanks{
  margin:15px 0;
  color:#159acb;
  font-size:28px;
  font-weight:bold;
  line-height:1.4;
  word-break:break-word;
}


/* =====================================
   完成
===================================== */

.complete{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
  z-index:200;
}

.complete.show{
  display:flex;
}

.complete-box{
  width:min(90%,420px);
  padding:30px;
  background:white;
  border-radius:20px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.complete-box h2{
  margin:0 0 15px;
  font-size:30px;
}

.complete-box p{
  font-size:16px;
  line-height:1.8;
}


/* =====================================
   スマホ
===================================== */

@media(max-width:600px){

  .container{
    padding:7px;
  }

  h1{
    font-size:20px;
  }

  .description{
    font-size:13px;
  }

  .gifter-grid{
    grid-template-columns:1fr;
  }

  .thanks{
    font-size:24px;
  }

  .loading-text{
    font-size:16px;
  }

}

</style>

</head>


<body>


<!-- =====================================
     画像読み込み中
===================================== -->

<div
  class="loading"
  id="loading"
>

  <div class="loading-spinner"></div>

  <div class="loading-text">

    画像を読み込み中…<br>
    少々お待ちください

  </div>

</div>


<div class="container">


<!-- =====================================
     タイトル
===================================== -->

<h1>
🎁 100ピース ギフトパズル
</h1>


<div class="description">

ウルトラスタンプ1個で1ピースOPEN！<br>

ピースをタップして
ギフターさんに感謝を伝えよう💖

</div>


<!-- =====================================
     操作
===================================== -->

<div class="controls">

<label>

<input
  type="file"
  id="imageInput"
  accept="image/*"
>

</label>


<button onclick="openRandomPiece()">
🎲 ランダムOPEN
</button>


<button onclick="resetPuzzle()">
🔄 リセット
</button>

</div>


<!-- =====================================
     カウンター
===================================== -->

<div class="counter">

完成：
<span id="count">0</span>
 / 100

</div>


<!-- =====================================
     パズル
===================================== -->

<div class="canvas-wrap">

<canvas id="puzzleCanvas"></canvas>

</div>


<!-- =====================================
     ギフター一覧
===================================== -->

<div class="section-title">
💝 ギフターさん一覧
</div>


<div
  class="gifter-grid"
  id="gifterGrid"
></div>


</div>


<!-- =====================================
     ありがとう
===================================== -->

<div
  class="modal"
  id="thanksModal"
>

  <div class="modal-box">

    <div class="piece-number">

      ピース No.
      <span id="popupPiece"></span>

    </div>


    <div class="thanks">

      <span id="popupName"></span>
      さんありがとう！💖

    </div>


    <button onclick="closeModal()">
      閉じる
    </button>

  </div>

</div>


<!-- =====================================
     完成
===================================== -->

<div
  class="complete"
  id="completeModal"
>

  <div class="complete-box">

    <h2>
      🎉 完成！ 🎉
    </h2>

    <p>
      100ピースのパズルが完成しました！
    </p>

    <p>
      たくさんの応援<br>
      ありがとうございました💖
    </p>

    <button onclick="closeComplete()">
      閉じる
    </button>

  </div>

</div>


<script>

/* =====================================
   基本設定
===================================== */

const COLS = 10;
const ROWS = 10;
const TOTAL = 100;

const W = 900;
const H = 900;


/* =====================================
   Canvas
===================================== */

const canvas =
  document.getElementById(
    "puzzleCanvas"
  );

const ctx =
  canvas.getContext("2d");

canvas.width = W;
canvas.height = H;


/* =====================================
   状態
===================================== */

let opened =
  new Array(TOTAL).fill(false);

let gifterNames =
  new Array(TOTAL).fill("");


/* =====================================
   画像
===================================== */

let image = new Image();

image.crossOrigin = "anonymous";

image.src =
"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80";


/* =====================================
   画像描画
===================================== */

function drawImage(){

  if(
    !image ||
    !image.complete ||
    !image.naturalWidth
  ){

    return;

  }


  /*
     正方形900×900に
     画像を中央トリミング
  */

  const scale =
    Math.max(
      W / image.naturalWidth,
      H / image.naturalHeight
    );


  const iw =
    image.naturalWidth * scale;

  const ih =
    image.naturalHeight * scale;


  const ix =
    (W - iw) / 2;

  const iy =
    (H - ih) / 2;


  ctx.drawImage(
    image,
    ix,
    iy,
    iw,
    ih
  );

}


/* =====================================
   パズル描画
   ★ 完全な正方形100個
===================================== */

function drawPuzzle(){

  const cellW =
    W / COLS;

  const cellH =
    H / ROWS;


  /*
     背景
  */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.fillStyle =
    "#9eddf4";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
     OPEN済みピース
  */

  for(let i = 0; i < TOTAL; i++){

    if(!opened[i]){
      continue;
    }


    const row =
      Math.floor(i / COLS);

    const col =
      i % COLS;


    const x =
      col * cellW;

    const y =
      row * cellH;


    /*
       その正方形だけ画像表示
    */

    ctx.save();

    ctx.beginPath();

    ctx.rect(
      x,
      y,
      cellW,
      cellH
    );

    ctx.clip();


    drawImage();


    ctx.restore();

  }


  /*
     正方形の境界線
  */

  ctx.lineWidth = 2;

  ctx.strokeStyle =
    "rgba(55,65,70,.85)";


  for(let r = 0; r <= ROWS; r++){

    const y =
      r * cellH;


    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }


  for(let c = 0; c <= COLS; c++){

    const x =
      c * cellW;


    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      H
    );

    ctx.stroke();

  }


  /*
     未OPEN番号
     ★ 丸なし
  */

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  for(let i = 0; i < TOTAL; i++){

    if(opened[i]){
      continue;
    }


    const row =
      Math.floor(i / COLS);

    const col =
      i % COLS;


    const x =
      col * cellW;

    const y =
      row * cellH;


    ctx.fillStyle =
      "#168cb8";


    ctx.font =
      "bold " +
      Math.floor(
        cellW * .20
      ) +
      "px Arial";


    ctx.fillText(

      i + 1,

      x + cellW / 2,

      y + cellH / 2

    );

  }

}


/* =====================================
   ギフター一覧
===================================== */

function createGifterList(){

  const grid =
    document.getElementById(
      "gifterGrid"
    );


  grid.innerHTML = "";


  for(let i = 0; i < TOTAL; i++){

    const row =
      document.createElement("div");

    row.className =
      "gifter-row";


    row.id =
      "gifterRow-" + i;


    if(opened[i]){

      row.classList.add(
        "opened"
      );

    }


    const number =
      document.createElement("div");

    number.className =
      "gifter-number";

    number.textContent =
      i + 1;


    const input =
      document.createElement("input");

    input.className =
      "gifter-input";

    input.placeholder =
      "ギフターさんの名前";

    input.value =
      gifterNames[i];


    input.addEventListener(
      "input",
      function(){

        gifterNames[i] =
          input.value;

      }
    );


    const status =
      document.createElement("div");

    status.className =
      "gifter-status";

    status.textContent =
      opened[i]
        ? "✅"
        : "";


    row.appendChild(
      number
    );

    row.appendChild(
      input
    );

    row.appendChild(
      status
    );

    grid.appendChild(
      row
    );

  }

}


/* =====================================
   名前処理
===================================== */

function cleanName(name){

  name =
    name.trim();


  if(
    name.endsWith("さん")
  ){

    name =
      name.substring(
        0,
        name.length - 2
      );

  }


  return name;

}


/* =====================================
   ピースOPEN
===================================== */

function openPiece(index){

  if(
    index < 0 ||
    index >= TOTAL
  ){

    return;

  }


  const rawName =
    gifterNames[index].trim();


  const clean =
    cleanName(rawName);


  const displayName =
    clean ||
    "ギフターさん";


  /*
     未OPENならOPEN
  */

  if(!opened[index]){

    opened[index] = true;


    updateGifterStatus(
      index
    );


    updateCounter();


    drawPuzzle();

  }


  /*
     ありがとう表示
  */

  document.getElementById(
    "popupPiece"
  ).textContent =
    index + 1;


  document.getElementById(
    "popupName"
  ).textContent =
    displayName;


  document.getElementById(
    "thanksModal"
  ).classList.add(
    "show"
  );


  checkComplete();

}


/* =====================================
   Canvasタップ
===================================== */

canvas.addEventListener(
  "click",
  function(e){

    const rect =
      canvas.getBoundingClientRect();


    const scaleX =
      W / rect.width;

    const scaleY =
      H / rect.height;


    const x =
      (e.clientX - rect.left)
      * scaleX;


    const y =
      (e.clientY - rect.top)
      * scaleY;


    const col =
      Math.floor(
        x / (W / COLS)
      );


    const row =
      Math.floor(
        y / (H / ROWS)
      );


    if(
      col < 0 ||
      col >= COLS ||
      row < 0 ||
      row >= ROWS
    ){

      return;

    }


    const index =
      row * COLS + col;


    openPiece(index);

  }
);


/* =====================================
   ランダムOPEN
===================================== */

function openRandomPiece(){

  const remaining = [];


  for(let i = 0; i < TOTAL; i++){

    if(!opened[i]){

      remaining.push(i);

    }

  }


  /*
     全部OPEN済み
  */

  if(
    remaining.length === 0
  ){

    return;

  }


  const index =
    remaining[
      Math.floor(
        Math.random()
        * remaining.length
      )
    ];


  openPiece(index);

}


/* =====================================
   ギフター状態更新
===================================== */

function updateGifterStatus(index){

  const row =
    document.getElementById(
      "gifterRow-" + index
    );


  if(!row){
    return;
  }


  row.classList.add(
    "opened"
  );


  const status =
    row.querySelector(
      ".gifter-status"
    );


  if(status){

    status.textContent =
      "✅";

  }

}


/* =====================================
   カウンター
===================================== */

function updateCounter(){

  const count =
    opened.filter(Boolean).length;


  document.getElementById(
    "count"
  ).textContent =
    count;

}


/* =====================================
   完成チェック
===================================== */

function checkComplete(){

  if(
    opened.every(Boolean)
  ){

    setTimeout(
      function(){

        document
          .getElementById(
            "completeModal"
          )
          .classList.add(
            "show"
          );

      },
      500
    );

  }

}


/* =====================================
   ありがとう閉じる
===================================== */

function closeModal(){

  document
    .getElementById(
      "thanksModal"
    )
    .classList.remove(
      "show"
    );

}


/* =====================================
   完成画面閉じる
===================================== */

function closeComplete(){

  document
    .getElementById(
      "completeModal"
    )
    .classList.remove(
      "show"
    );

}


/* =====================================
   リセット
===================================== */

function resetPuzzle(){

  const ok =
    confirm(
      "パズルを最初からやり直しますか？"
    );


  if(!ok){
    return;
  }


  opened =
    new Array(
      TOTAL
    ).fill(false);


  createGifterList();

  updateCounter();

  drawPuzzle();

}


/* =====================================
   画像選択
===================================== */

document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    function(e){

      const file =
        e.target.files[0];


      if(!file){
        return;
      }


      /*
         読み込み表示
      */

      const loading =
        document.getElementById(
          "loading"
        );


      loading.classList.add(
        "show"
      );


      const reader =
        new FileReader();


      /*
         FileReader成功
      */

      reader.onload =
        function(event){

          const newImage =
            new Image();


          /*
             画像読み込み成功
          */

          newImage.onload =
            function(){

              image =
                newImage;


              /*
                 パズル更新
              */

              drawPuzzle();


              /*
                 少し表示してから
                 ローディング終了
              */

              setTimeout(
                function(){

                  loading.classList.remove(
                    "show"
                  );

                },
                300
              );

            };


          /*
             画像読み込み失敗
          */

          newImage.onerror =
            function(){

              loading.classList.remove(
                "show"
              );


              alert(
                "画像を読み込めませんでした。"
              );

            };


          newImage.src =
            event.target.result;

        };


      /*
         FileReader失敗
      */

      reader.onerror =
        function(){

          loading.classList.remove(
            "show"
          );


          alert(
            "画像を読み込めませんでした。"
          );

        };


      reader.readAsDataURL(file);

    }
  );


/* =====================================
   初期化
===================================== */

createGifterList();

updateCounter();

drawPuzzle();


/*
   初期画像読み込み
*/

image.onload =
  function(){

    drawPuzzle();

  };

</script>

</body>

</html>
